name: ND_CAFMaker CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (prof)
    # we are pinning to 24.04 because Apptainer's PPA is not correctly being read in 26.04.
    # the Ubuntu Apptainer package has a bug (apptainer/apptainer#3487) that sets up the wrong AppArmor path.
    # 24.04 will be supported until 2029.  we can revisit the situation then, if needed.
    runs-on: ubuntu-24.04 

    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer

      - name: Setup CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v4
        with:
          cvmfs_repositories: "dune.opensciencegrid.org,larsoft.opensciencegrid.org,fermilab.opensciencegrid.org,oasis.opensciencegrid.org,singularity.opensciencegrid.org"

      # NOTE: bash -c (no -e) is required. UPS products/setup uses &&/|| chains
      # that return non-zero when running under sh (e.g. "test $ss = csh && ...").
      # bash -e would treat those as fatal errors. Interactive singularity shells
      # work because set -e is off by default. cmake exits are checked explicitly.
      - name: Build, install, and test
        run: |
          apptainer exec \
            --bind /cvmfs \
            --bind "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            /cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest \
            bash -c "
              cd '${GITHUB_WORKSPACE}'
              source ndcaf_setup_deps.sh prof
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release || exit \$?
              cmake --build build -j\$(nproc) || exit \$?
              cmake --install build --prefix install || exit \$?

              # Test: sourcing ndcaf_setup.sh from the install tree must put
              # makeCAF in PATH and let it run --help end-to-end. This catches
              # regressions in the script split (Commit 1) and the install
              # layout / RPATH (Commit 3).
              source install/bin/ndcaf_setup.sh prof || exit \$?
              command -v makeCAF || { echo 'makeCAF not in PATH'; exit 1; }
              makeCAF --help || exit \$?
            " 2>&1

      - name: Run CAFMaker
        run: |
          apptainer exec \
            --bind /cvmfs \
            --bind "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            /cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest \
            bash -c "
              cd '${GITHUB_WORKSPACE}' || exit \$?
              source install/bin/ndcaf_setup.sh prof || exit \$?
              mkdir -p outputs || exit \$?
              makeCAF --fcl=cafmaker_0000965.fcl -n 1 || exit \$?
            " 2>&1

      - name: Dump CAF output
        run: |
          python3 -m pip install uproot awkward numpy
          python3 test/scripts/dumper.py outputs/MiniProdN5p1_NDComplex_FHC.0000965.CAF.root --vector-entries 5

      - name: Compare CAF output with reference
        run: |
          diff -u \
            test/references/MiniProdN5p1_NDComplex_FHC.0000965.CAF.root.json \
            outputs/MiniProdN5p1_NDComplex_FHC.0000965.CAF.root.json
